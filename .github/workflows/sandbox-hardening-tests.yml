          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev

      - name: Run repeated remaining-boundary suite
        run: sudo -E go test -timeout 300s -v -count=3 -run '^TestSecurityBoundaryNamespacesAndInheritedResources$' ./...

  test-regression-guards:
    name: "Hardening: Regression Guards"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run regression guard checks
        run: bash .github/scripts/check_regressions.sh
