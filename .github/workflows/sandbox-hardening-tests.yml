          sudo apt-get install -y gcc libc6-dev

      - name: Run hostile boundary attack chain
        run: sudo -E go test -timeout 300s -v -count=3 -run '^TestSandboxHardeningC$/^hostile boundary attack chain cannot cross sandbox$' ./...

  test-remaining-boundaries:
    name: "Hardening: IPC UTS Proc FD Socket Temp Boundaries"
    runs-on: ubuntu-latest
