name: Regression Guards

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  regression-guards:
    name: Regression Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet all packages
        run: go vet ./...

      - name: Run unit tests (non-root packages)
        run: go test ./config ./dispatcher ./executor ./models ./resourcemanager ./routes ./tests/executor

      - name: Run regression guard checks
        run: bash .github/scripts/check_regressions.sh
