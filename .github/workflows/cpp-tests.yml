name: C++ Integration Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-filesystem-isolation:
    name: "Security: Filesystem Isolation (File Privacy)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libc6-dev

      - name: Run filesystem isolation subtest
        run: sudo -E go test -v -run '^TestSandboxIsolationCpp$/^file privacy across request IDs$' ./...

